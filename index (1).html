<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자 막대 레이스</title>

<!-- 한글 폰트를 인터넷에서 불러옵니다 (자동) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

<style>
  /* ===== 화면 기본 모양 (건드릴 필요 없어요) ===== */
  html, body {
    margin: 0; padding: 0;
    background: #1a1a1a;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    font-family: 'Noto Sans KR', sans-serif;
  }
  /* 세로 영상 틀 (인스타/유튜브 쇼츠 비율 9:16) */
  #phone {
    width: 405px; height: 720px;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    border-radius: 24px;
  }
  #titleTop { position:absolute; top:34px; left:0; right:0; text-align:center;
    color:#8a8a8a; font-size:15px; letter-spacing:1px; }
  #titleMain { position:absolute; top:60px; left:0; right:0; text-align:center;
    color:#f5f5f5; font-size:24px; font-weight:700; }
  #cv { position:absolute; top:120px; left:24px; }
  #yearBig { position:absolute; bottom:120px; right:30px;
    color:#1e1e1e; font-size:84px; font-family:'Black Han Sans', sans-serif; }
  #handle { position:absolute; bottom:38px; left:0; right:0; text-align:center;
    color:#666; font-size:15px; }
  #replay { position:absolute; bottom:34px; left:30px;
    background:#222; color:#aaa; border:none; border-radius:8px;
    padding:8px 14px; font-size:13px; cursor:pointer; font-family:'Noto Sans KR'; }
</style>
</head>
<body>

<div id="phone">
  <div id="titleTop">10년 전 100만원 투자했다면</div>
  <div id="titleMain">자산별 현재 가치</div>
  <canvas id="cv" width="714" height="800"></canvas>
  <div id="yearBig">2016</div>
  <div id="handle">@your_handle</div>
  <button id="replay" onclick="startRace()">다시 재생</button>
</div>

<script>
/* ============================================================
   ★★★ 여기 'CONFIG'만 바꾸면 영상이 바뀝니다 ★★★
   ============================================================ */
var CONFIG = {
  titleTop:  "10년 전 100만원 투자했다면",   // 위 작은 글씨
  titleMain: "자산별 현재 가치",             // 큰 제목
  handle:    "@your_handle",                // 내 계정 이름

  // 연도 목록 (왼쪽부터 오른쪽으로 시간 흐름)
  years: [2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026],

  // 자산들. series = 각 연도에 '100만원이 몇 배가 됐나'.
  //  예: 1.0 = 100만원, 4 = 400만원, 90 = 9000만원
  //  ★ 진짜 데이터로 바꾸세요. 연도 개수와 숫자 개수가 같아야 해요.
  assets: [
    { name:"비트코인",   color:"#f0a500", series:[1.0, 4, 9, 22, 16, 35, 60, 55, 70, 78, 90] },
    { name:"SK하이닉스", color:"#5b9bd5", series:[1.0, 1.3, 1.5, 1.4, 1.8, 2.2, 2.0, 2.6, 4, 9, 18] },
    { name:"삼성전자",   color:"#5dcaa5", series:[1.0, 1.4, 1.7, 1.5, 1.9, 2.4, 2.2, 2.5, 2.3, 3.0, 5] },
    { name:"코스피ETF",  color:"#c08fe0", series:[1.0, 1.1, 1.25, 1.15, 1.3, 1.5, 1.45, 1.6, 1.7, 2.1, 2.6] },
    { name:"예금",       color:"#9aa0a6", series:[1.0, 1.02, 1.04, 1.06, 1.09, 1.12, 1.14, 1.17, 1.2, 1.24, 1.28] }
  ],

  durationSec: 9   // 영상 길이(초). 길게 하려면 숫자를 키우세요.
};
/* ============================================================
   아래부터는 건드릴 필요 없어요 (그리는 기계 부분)
   ============================================================ */

document.getElementById('titleTop').textContent  = CONFIG.titleTop;
document.getElementById('titleMain').textContent = CONFIG.titleMain;
document.getElementById('handle').textContent    = CONFIG.handle;

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var ROW_H = 132, BAR_H = 96;

function fmt(mult){
  var won = 1000000 * mult;
  if (won >= 100000000) return (won/100000000).toFixed(1) + "억";
  return Math.round(won/10000).toLocaleString() + "만";
}
function lerp(a,b,t){ return a + (b-a)*t; }
function easeInOut(t){ return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }

function valueAt(series, fpos){
  var i = Math.floor(fpos), frac = fpos - i;
  if (i >= series.length-1) return series[series.length-1];
  return lerp(series[i], series[i+1], easeInOut(frac));
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x,y+h); c.closePath();
}

var rankState = {};
function draw(fpos){
  ctx.clearRect(0,0,W,H);
  var vals = CONFIG.assets.map(function(a){
    return { name:a.name, color:a.color, v:valueAt(a.series, fpos) };
  });
  var maxV = Math.max.apply(null, vals.map(function(d){return d.v;}));
  var sorted = vals.slice().sort(function(a,b){ return b.v - a.v; });
  var targetRank = {};
  sorted.forEach(function(d,r){ targetRank[d.name] = r; });

  vals.forEach(function(d){
    if (rankState[d.name] === undefined) rankState[d.name] = targetRank[d.name];
    rankState[d.name] = lerp(rankState[d.name], targetRank[d.name], 0.18);
    var y = rankState[d.name] * ROW_H;
    var w = Math.max(d.v/maxV * (W-14), 120);
    ctx.fillStyle = d.color;
    roundRect(ctx, 0, y, w, BAR_H, 12); ctx.fill();
    ctx.fillStyle = "#0a0a0a";
    ctx.font = "900 30px 'Noto Sans KR', sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillText(d.name, 18, y + BAR_H/2);
    ctx.fillStyle = d.color;
    ctx.font = "700 32px 'Noto Sans KR', sans-serif";
    ctx.fillText(fmt(d.v), w + 14, y + BAR_H/2);
  });
}

function startRace(){
  rankState = {};
  var totalFrames = CONFIG.years.length - 1;
  var dur = CONFIG.durationSec * 1000;
  var t0 = performance.now();
  function tick(now){
    var p = Math.min((now - t0)/dur, 1);
    var fpos = p * totalFrames;
    draw(fpos);
    var yi = Math.min(Math.floor(fpos), CONFIG.years.length-1);
    document.getElementById('yearBig').textContent = CONFIG.years[yi];
    if (p < 1) requestAnimationFrame(tick);
    else { draw(totalFrames); document.getElementById('yearBig').textContent = CONFIG.years[CONFIG.years.length-1]; }
  }
  requestAnimationFrame(tick);
}

window.onload = function(){ setTimeout(startRace, 400); };
</script>
</body>
</html>
